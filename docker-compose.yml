services:
  db:
    image: postgres:15-alpine
    container_name: gerenciador-db
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-gerenciador}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    restart: always

  redis:
    image: redis:alpine
    container_name: gerenciador-redis
    restart: always

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: gerenciador-evolution
    restart: always
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080
      - AUTHENTICATION_API_KEY=B8D9F0A1C2E345678901234567890ABC
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@db:5432/postgres
      - REDIS_ENABLED=true
      - REDIS_URI=redis://gerenciador-redis:6379/2
      - CACHE_REDIS_URI=redis://gerenciador-redis:6379/2
      - DEL_INSTANCE=false
      - SERVER_URL=http://localhost:8081
    depends_on:
      - db
      - redis
    volumes:
      - ./evolution_store:/evolution/store

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gerenciador-backend
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    volumes:
      - ./backend:/app
      - ./data/media:/app/media
      - ./data/static:/app/static
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-gerenciador}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - REDIS_URL=redis://redis:6379/1
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME}
      - EVOLUTION_INSTANCE_TOKEN=${EVOLUTION_INSTANCE_TOKEN}
    depends_on:
      - db
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gerenciador-frontend
    user: root
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost/api}
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend
      - redis
    restart: always

  nginx:
    image: nginx:stable-alpine
    container_name: gerenciador-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/media:/usr/share/nginx/html/media:ro
      - ./data/static:/usr/share/nginx/html/static:ro
    depends_on:
      - backend
      - frontend
      - redis
    restart: always
