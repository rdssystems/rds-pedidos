events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    client_max_body_size 20M;

    upstream frontend {
        server frontend:3000;
    }

    upstream landing-site {
        server landing-page:3000;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name rdspedidos.com.br www.rdspedidos.com.br app.rdspedidos.com.br 129.121.45.7;

        # Main Routing
        location / {
            set $upstream_target "frontend";

            # Se for o domínio principal vindo na raiz (/), mostra landing-page
            if ($uri = "/") {
                set $upstream_target "landing-site";
            }

            # Mas se for o subdomínio app ou IP direto, SEMPRE vai pro frontend no root
            if ($host ~* "app.rdspedidos.com.br") {
                set $upstream_target "frontend";
            }
            if ($host = "129.121.45.7") {
                set $upstream_target "frontend";
            }

            # Se estiver vindo pela raiz mas for domínio principal, mostra landing-page
            # Mas se for qualquer outra rota (/login, /loja/...), vai pro frontend
            if ($uri != "/") {
                set $upstream_target "frontend";
            }

            proxy_pass http://$upstream_target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Landing Page Assets (Pre-prefixed in Next.js)
        location /landing-assets/ {
            rewrite ^/landing-assets/(.*) /$1 break;
            proxy_pass http://landing-site;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Landing Page Public Assets
        location /assets/ {
            proxy_pass http://landing-site;
            proxy_set_header Host $host;
        }

        # Frontend Next.js technical routes (HMR, static assets)
        location /_next/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Django technical Admin (Backend)
        location /django-admin/ {
            proxy_pass http://backend/django-admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Django API
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Django WebSocket (Optional but good for explicit routes)
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Media (Performance optimization)
        location /media/ {
            alias /usr/share/nginx/html/media/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Django Static
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
