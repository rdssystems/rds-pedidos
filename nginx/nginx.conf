events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    client_max_body_size 20M;

    upstream frontend {
        server frontend:3000;
    }

    upstream landing-site {
        server landing-page:3000;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name rdspedidos.com.br www.rdspedidos.com.br app.rdspedidos.com.br 129.121.45.7;

        # Netdata Proxy (Localhost monitoring)
        location = /netdata {
            return 301 /netdata/;
        }
        location ^~ /netdata/ {
            auth_basic "Netdata Access Restricted";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rewrite /netdata/foo to /foo for the backend netdata
            rewrite ^/netdata/(.*) /$1 break;
            proxy_pass http://host.docker.internal:19999;
            
            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            proxy_set_header Connection "keep-alive";
            proxy_store off;
        }

        # Main Routing
        location / {
            set $upstream_target "frontend";

            # Se for o domínio principal vindo na raiz (/), mostra landing-page
            if ($uri = "/") {
                set $upstream_target "landing-site";
            }

            # Mas se for o subdomínio app ou IP direto, SEMPRE vai pro frontend no root
            if ($host ~* "app.rdspedidos.com.br") {
                set $upstream_target "frontend";
            }
            if ($host = "129.121.45.7") {
                set $upstream_target "frontend";
            }

            # Se estiver vindo pela raiz mas for domínio principal, mostra landing-page
            # Mas se for qualquer outra rota (/login, /loja/...), vai pro frontend
            if ($uri != "/") {
                set $upstream_target "frontend";
            }

            proxy_pass http://$upstream_target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /_next/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
        }

        location /media/ {
            alias /usr/share/nginx/html/media/;
            expires 30d;
        }
    }
}
