events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    sendfile        on;
    keepalive_timeout  65;

    client_max_body_size 20M;

    upstream frontend {
        server frontend:80;
    }

    upstream landing-site {
        server landing-page:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # ==========================================
    # Landing Page: rdspedidos.com.br
    # ==========================================
    server {
        listen 80;
        server_name rdspedidos.com.br www.rdspedidos.com.br;

        location / {
            proxy_pass http://landing-site;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files and assets (Vite)
        location /assets/ {
            proxy_pass http://landing-site;
        }
    }

    # ==========================================
    # App: app.rdspedidos.com.br + IP direto
    # ==========================================
    server {
        listen 80 default_server;
        server_name app.rdspedidos.com.br 129.121.45.7 localhost 127.0.0.1;

        # Glances Monitoring
        location = /monitoring {
            return 301 /monitoring/;
        }
        location ^~ /monitoring/ {
            auth_basic "Monitoring Access Restricted";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rewrite /monitoring/foo to /foo for the backend glances
            rewrite ^/monitoring/(.*) /$1 break;
            proxy_pass http://host.docker.internal:61208;

            proxy_http_version 1.1;
            proxy_pass_request_headers on;
            proxy_set_header Connection "keep-alive";
            proxy_store off;
        }

        # Frontend App
        location / {
            # Redireciona a raiz para o login para evitar a página inicial padrão
            if ($uri = "/") {
                return 301 /login;
            }
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files and assets (Vite)
        location /assets/ {
            proxy_pass http://frontend;
        }

        # WebSocket support
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django API
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Admin
        location /django-admin/ {
            proxy_pass http://backend/django-admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django Static files
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
        }

        # Media files
        location /media/ {
            alias /usr/share/nginx/html/media/;
            expires 30d;
        }
    }
}
